<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nossa Playlist ❤️</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div
        class="coracoes"
        id="coracoes"
    ></div>


    <main class="pagina-container">

        <section class="card">

            <a
                href="index.html"
                class="voltar"
            >
                ← Voltar para o início
            </a>


            <p class="mini-titulo">
                nossa trilha sonora
            </p>


            <h1>
                Nossa Playlist 🎧
            </h1>


            <p class="descricao">
As músicas que, de algum jeito,
viraram parte da nossa história.

Toda vez que alguma delas tocar,
espero que você lembre de nós. ❤️
            </p>


            <div class="spotify-card">

                <h2>
                    Giulia + Rodrigo ❤️
                </h2>

                <p>
                    Nossa trilha sonora
                </p>


                <iframe

                    src="https://open.spotify.com/embed/playlist/0o2YvjPPMacOOHrAfawBCY?utm_source=generator&theme=0"

                    width="100%"

                    height="500"

                    frameborder="0"

                    allowfullscreen=""

                    allow="
                        autoplay;
                        clipboard-write;
                        encrypted-media;
                        fullscreen;
                        picture-in-picture
                    "

                    loading="lazy"

                ></iframe>

            </div>

        </section>

    </main>


    <script src="js/principal.js"></script>

</body>

</html>
