<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Frases para Giulia 🌹</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div
        class="coracoes"
        id="coracoes"
    ></div>

    <main class="pagina-container">

        <section class="card">

            <a
                href="index.html"
                class="voltar"
            >
                ← Voltar para o início
            </a>

            <p class="mini-titulo">
                só para você
            </p>

            <h1>
                Uma frase para Giulia 🌹
            </h1>

            <p class="descricao">
                Para quando você precisar
                lembrar o quanto é especial para mim.
            </p>

            <div class="frase-box">

                <p id="frase">
                    Clique abaixo e descubra
                    o que meu coração quer
                    te dizer hoje.
                </p>

            </div>

            <button
                id="gerarFrase"
                class="botao-principal"
            >
                ❤️ Nova frase
            </button>

        </section>

    </main>

    <script src="js/principal.js"></script>
    <script src="js/frases.js"></script>

</body>

</html>
