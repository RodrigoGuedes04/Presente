<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Poemas para Giulia ❤️</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div
        class="coracoes"
        id="coracoes"
    ></div>

    <main class="pagina-container">

        <section class="card">

            <a
                href="index.html"
                class="voltar"
            >
                ← Voltar para o início
            </a>

            <p class="mini-titulo">
                palavras para o meu amor
            </p>

            <h1>
                Poemas para Giulia ❤️
            </h1>

            <p class="descricao">
                Escolha um sentimento e
                deixe meu coração escrever
                alguma coisa para você.
            </p>

            <div class="categorias">

                <button
                    class="categoria ativo"
                    data-categoria="romantico"
                >
                    ❤️ Romântico
                </button>

                <button
                    class="categoria"
                    data-categoria="fofo"
                >
                    🥰 Fofo
                </button>

                <button
                    class="categoria"
                    data-categoria="saudade"
                >
                    🌙 Saudade
                </button>

                <button
                    class="categoria"
                    data-categoria="futuro"
                >
                    ✨ Futuro
                </button>

                <button
                    class="categoria"
                    data-categoria="eterno"
                >
                    💍 Amor eterno
                </button>

            </div>

            <div class="poema-box">

                <p id="poema">
    Clique abaixo para receber
    um poema feito especialmente
    para você.
</p>

            </div>

            <button
    id="botaoGerar"
    class="botao-principal"
>
    💌 Gerar poema
</button>

            <p class="contador">
                Poemas criados:
                <span id="contador">
                    0
                </span>
            </p>

        </section>

    </main>

<script src="js/principal.js"></script>
<script src="js/poemas.js"></script>

</body>
</html>
